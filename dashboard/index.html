<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Dashboard</title>
<style>
:root{color-scheme:light;--bg:#fcfcfb;--panel:#fff;--line:#e4e3df;--text:#111;--muted:#696864;--blue:#2a78d6;--orange:#eb6834;--green:#1baf7a;--red:#d03b3b}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1a1a19;--panel:#222220;--line:#3a3a37;--text:#fff;--muted:#b7b6af;--blue:#3987e5;--orange:#d95926;--green:#199e70}}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}h1{font-size:20px;margin:0}h2{font-size:13px;color:var(--muted);letter-spacing:.04em;margin:0 0 10px}.meta,.small{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-bottom:12px}.tile,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}.key{color:var(--muted);font-size:12px}.value{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}td{padding:5px 3px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}.chart{width:100%;height:170px}.danger{color:var(--red)}.ok{color:var(--green)}.empty{color:var(--muted);padding:20px 0}
</style></head><body>
<header><h1>City Dashboard</h1><div id="meta" class="meta">连接中…</div></header>
<div id="tiles" class="grid"></div>
<div class="row"><section class="panel"><h2>人口趋势</h2><svg id="population-chart" class="chart"></svg></section><section class="panel"><h2>区域需求</h2><div id="demand"></div></section></div>
<div class="row"><section class="panel"><h2>城市问题</h2><div id="problems"></div></section><section class="panel"><h2>公共设施</h2><div id="facilities"></div></section></div>
<div class="row"><section class="panel"><h2>土地分区</h2><div id="zones"></div></section><section class="panel"><h2>税率</h2><div id="taxes"></div></section></div>
<div class="small">只读看板 · 数据由游戏所在电脑主动推送 · 游戏暂停时，游戏内数值不会变化</div>
<script>
const $=id=>document.getElementById(id),fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={Residential:'住宅',Commercial:'商业',Industrial:'工业',Office:'办公',Electricity:'电力',Water:'供水',Education:'教育',HealthCare:'医疗',Garbage:'垃圾',FireDepartment:'消防',PoliceDepartment:'警察',ResidentialLow:'低密住宅',ResidentialHigh:'高密住宅',CommercialLow:'低密商业',CommercialHigh:'高密商业',Unzoned:'未分区',workplace:'就业'};
const label=s=>names[s]||s;
function tile(k,v,d=''){return `<div class="tile"><div class="key">${esc(k)}</div><div class="value">${v}</div><div class="small">${esc(d)}</div></div>`}
function rows(obj,unit=''){const list=Array.isArray(obj)?obj:Object.entries(obj||{}).map(([name,count])=>({name,count}));return list.length?`<table>${list.map(x=>`<tr><td>${esc(label(x.name))}</td><td>${fmt(x.count)}${unit}</td></tr>`).join('')}</table>`:'<div class="empty">暂无数据</div>'}
function chart(data){const svg=$('population-chart'),v=data.slice(-240);if(v.length<2){svg.innerHTML='<text x="12" y="85" fill="currentColor">等待更多采样…</text>';return}const W=600,H=170,p=22,min=Math.min(...v.map(x=>x.population)),max=Math.max(...v.map(x=>x.population)),span=Math.max(1,max-min),points=v.map((x,i)=>`${p+i*(W-2*p)/(v.length-1)},${H-p-(x.population-min)/span*(H-2*p)}`).join(' ');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=`<line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--line)"/><polyline fill="none" stroke="var(--blue)" stroke-width="3" points="${points}"/><text x="${p}" y="15" fill="var(--muted)" font-size="12">${fmt(max)}</text><text x="${p}" y="${H-5}" fill="var(--muted)" font-size="12">${fmt(min)}</text>`}
function render(data){const s=data.latest,m=s.summary,age=Math.round((Date.now()-Date.parse(s.at))/1000),stale=age>180;$('meta').innerHTML=`游戏日期 ${esc(m.gameTime)} · ${m.simulation.paused?'已暂停':'速度 '+m.simulation.finalSpeed} · <span class="${stale?'danger':'ok'}">${stale?'数据已过期':'在线推送'}</span> · 最近更新 ${new Date(s.at).toLocaleString('zh-CN')}（${age} 秒前）`;$('tiles').innerHTML=tile('人口',fmt(m.citizens.count),'当前市民数')+tile('问题',fmt(s.problems.total),'全城问题对象')+tile('公共设施',fmt(s.facilities.total),'按游戏服务分类')+tile('已分区',fmt(s.zones.zonedCells),'地块单元')+tile('道路',fmt(m.network.segments),'网络路段')+tile('状态',m.simulation.paused?'已暂停':'运行中','模拟速度 '+m.simulation.finalSpeed);chart(data.history||[]);const d=m.demand;$('demand').innerHTML=[['住宅',d.residential,'var(--green)'],['商业',d.commercial,'var(--blue)'],['就业',d.workplace,'var(--orange)']].map(([n,v,c])=>`<div>${n} <span style="float:right">${fmt(v)} / 100</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%;background:${c}"></i></div>`).join('');$('problems').innerHTML=rows(s.problems.countsByProblem);$('facilities').innerHTML=rows(s.facilities.countsByService);$('zones').innerHTML=rows((s.zones.zones||[]).filter(x=>x.zone!=='Unzoned').map(x=>({name:x.zone,count:x.cells})),' 格');$('taxes').innerHTML=rows((s.taxes||[]).map(x=>({name:label(x.subService),count:x.rate})),'%')}
async function poll(){try{const r=await fetch('/api/snapshot',{cache:'no-store'}),d=await r.json();if(!d.ok){$('meta').textContent='等待本地游戏首次推送…';return}render(d)}catch(e){$('meta').textContent='看板服务器暂不可用'}}poll();setInterval(poll,10000);
</script></body></html>
