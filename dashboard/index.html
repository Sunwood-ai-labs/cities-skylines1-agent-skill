<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Dashboard</title>
<style>
:root{color-scheme:light;--bg:#f5f6f7;--panel:#fff;--line:#e4e6e8;--text:#17191c;--muted:#70757c;--blue:#3279d2;--orange:#e8793c;--green:#18a477;--red:#d34b4b;--purple:#8562cb}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#17191c;--panel:#222529;--line:#383c42;--text:#f4f5f6;--muted:#a4a9b0;--blue:#5995e3;--orange:#f0965d;--green:#32bd92;--red:#ed7373;--purple:#a78be4}}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{font-size:20px;margin:0}h2{font-size:13px;color:var(--muted);letter-spacing:.03em;margin:0 0 10px}.meta,.small{color:var(--muted);font-size:12px}.controls{display:flex;gap:12px;align-items:center}select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}.tile,.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;min-width:0}.key{color:var(--muted);font-size:12px}.value{font-size:23px;font-weight:650;font-variant-numeric:tabular-nums}.tile .small{min-height:18px}.chart{width:100%;height:190px;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:0 0 5px}.legend i{display:inline-block;width:13px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}.chart text{font-family:inherit}.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 11px}.bar i{display:block;height:100%;border-radius:5px}table{width:100%;border-collapse:collapse}td{padding:5px 3px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}.danger{color:var(--red)}.ok{color:var(--green)}.empty{color:var(--muted);padding:20px 0}.footer{padding:4px 2px 12px}
.autonomy-strip{display:flex;align-items:flex-start;gap:14px;margin:0 0 12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.autonomy-strip strong{flex:none;width:76px;padding-top:2px;color:var(--green);font-size:12px}.ticker-viewport{height:72px;overflow:hidden;flex:1}.ticker-track{display:flex;flex-direction:column;width:100%;gap:0}.ticker-track.feed-change{animation:feed-up .42s ease-out}.ticker-track.empty-ticker{color:var(--muted)}.ticker-entry{display:block;flex:none;height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:24px;color:var(--text)}.ticker-entry time{color:var(--muted);margin-right:6px}.ticker-entry.applied{color:var(--green)}.ticker-entry.review,.ticker-entry.rejected{color:var(--orange)}@keyframes feed-up{from{transform:translateY(24px);opacity:.45}to{transform:translateY(0);opacity:1}}
</style></head><body>
<header><div><h1>City Dashboard</h1><div id="meta" class="meta">连接中…</div></div><div class="controls"><span class="small">页面刷新</span><select id="refresh"><option value="3" selected>3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></div></header>
<div class="autonomy-strip"><strong>自治动态</strong><div class="ticker-viewport"><div id="autonomy-ticker" class="ticker-track empty-ticker">等待自治程序动态…</div></div></div>
<div id="tiles" class="grid"></div>
<div class="row"><section class="panel"><h2>人口趋势 · 最近 1 小时</h2><svg id="population-chart" class="chart"></svg></section><section class="panel"><h2>财政余额 · 最近 1 小时</h2><svg id="balance-chart" class="chart"></svg></section></div>
<div class="row"><section class="panel"><h2>账期收入与支出 · 最近 1 小时</h2><div class="legend"><span><i style="background:var(--green)"></i>收入</span><span><i style="background:var(--orange)"></i>支出</span><span><i style="background:var(--purple)"></i>净额</span></div><svg id="finance-chart" class="chart"></svg></section><section class="panel"><h2>区域需求趋势 · 最近 1 小时</h2><div class="legend"><span><i style="background:var(--green)"></i>住宅</span><span><i style="background:var(--blue)"></i>商业</span><span><i style="background:var(--orange)"></i>就业</span></div><svg id="demand-chart" class="chart"></svg></section></div>
<div class="row"><section class="panel"><h2>各类建筑数量趋势 · 最近 1 小时</h2><div class="legend"><span><i style="background:var(--green)"></i>住宅</span><span><i style="background:var(--blue)"></i>商业</span><span><i style="background:var(--orange)"></i>工业</span></div><svg id="buildings-chart" class="chart"></svg></section></div>
<div class="row"><section class="panel"><h2>当前区域需求</h2><div id="demand"></div></section><section class="panel"><h2>城市问题</h2><div id="problems"></div></section><section class="panel"><h2>公共设施</h2><div id="facilities"></div></section><section class="panel"><h2>已建建筑数量</h2><div id="buildings"></div></section></div>
<div class="row"><section class="panel"><h2>土地分区</h2><div id="zones"></div></section><section class="panel"><h2>税率</h2><div id="taxes"></div></section></div>
<div class="small footer">游戏每 3 秒推送一次核心状态；设施、分区、建筑数量、自治动态与问题统计每 30 秒更新。自治动态仅在有新事件时从下向上滚动。数据保留 1 小时。仅显示游戏桥接实际读取到的数值。</div>
<script>
const $=id=>document.getElementById(id),fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN'),money=n=>n==null?'—':'₡'+fmt(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={Residential:'住宅',Commercial:'商业',Industrial:'工业',Office:'办公',Electricity:'电力',Water:'供水',Education:'教育',HealthCare:'医疗',Garbage:'垃圾',FireDepartment:'消防',PoliceDepartment:'警察',ResidentialLow:'低密住宅',ResidentialHigh:'高密住宅',CommercialLow:'低密商业',CommercialHigh:'高密商业',Unzoned:'未分区',workplace:'就业'};
const label=s=>names[s]||s;
function tile(k,v,d=''){return `<div class="tile"><div class="key">${esc(k)}</div><div class="value">${v}</div><div class="small">${esc(d)}</div></div>`}
function rows(obj,unit=''){const list=Array.isArray(obj)?obj:Object.entries(obj||{}).map(([name,count])=>({name,count}));return list.length?`<table>${list.map(x=>`<tr><td>${esc(label(x.name))}</td><td>${fmt(x.count)}${unit}</td></tr>`).join('')}</table>`:'<div class="empty">暂无数据</div>'}
function lineChart(id,data,series,format=fmt){const svg=$(id),usable=data.filter(r=>series.some(s=>Number.isFinite(r[s.key])));if(usable.length<2){svg.innerHTML='<text x="12" y="90" fill="var(--muted)">采集中，稍后显示趋势…</text>';return}const W=640,H=190,L=52,R=12,T=12,B=24,values=usable.flatMap(r=>series.map(s=>r[s.key]).filter(Number.isFinite));let min=Math.min(...values),max=Math.max(...values);if(min===max){min-=1;max+=1}const pad=(max-min)*.08;min-=pad;max+=pad;const x=i=>L+(W-L-R)*i/(usable.length-1),y=v=>T+(H-T-B)*(1-(v-min)/(max-min));let out='';for(let i=0;i<=3;i++){const v=min+(max-min)*i/3,yy=y(v);out+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" fill="var(--muted)" font-size="10">${esc(format(v))}</text>`}for(const s of series){const pts=[];usable.forEach((r,i)=>{if(Number.isFinite(r[s.key]))pts.push(`${x(i).toFixed(1)},${y(r[s.key]).toFixed(1)}`)});if(pts.length>1)out+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/>`}out+=`<text x="${L}" y="${H-4}" fill="var(--muted)" font-size="10">${new Date(usable[0].at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</text><text x="${W-R}" y="${H-4}" text-anchor="end" fill="var(--muted)" font-size="10">${new Date(usable.at(-1).at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</text>`;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=out}
let autonomyEventsKey='';function renderAutonomy(events){const key=JSON.stringify(events||[]);if(key===autonomyEventsKey)return;autonomyEventsKey=key;const track=$('autonomy-ticker');track.classList.remove('feed-change');const items=(events||[]).slice(-3);track.replaceChildren();if(!items.length){track.textContent='暂无自治动态';track.classList.add('empty-ticker');return}track.classList.remove('empty-ticker');for(const event of items){const entry=document.createElement('div');entry.className=`ticker-entry ${event.type==='action-applied'?'applied':event.type==='human-review-required'?'review':event.type==='action-rejected'?'rejected':''}`;const time=document.createElement('time');time.textContent=new Date(event.at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});entry.append(time,document.createTextNode(event.text||''));track.append(entry)}void track.offsetHeight;track.classList.add('feed-change')}
function renderBuildingTrend(history){lineChart('buildings-chart',history||[],[{key:'residentialBuildings',color:'var(--green)'},{key:'commercialBuildings',color:'var(--blue)'},{key:'industrialBuildings',color:'var(--orange)'}])}
function render(data){const s=data.latest,m=s.summary,e=s.economy||{},age=Math.max(0,Math.round((Date.now()-Date.parse(s.at))/1000)),stale=age>15;$('meta').innerHTML=`游戏日期 ${esc(m.gameTime)} · ${m.simulation.paused?'已暂停':'运行中'} · <span class="${stale?'danger':'ok'}">${stale?'数据过期':'在线'}</span> · 更新于 ${new Date(s.at).toLocaleTimeString('zh-CN')}（${age} 秒前）`;$('tiles').innerHTML=tile('人口',fmt(m.citizens.count),'市民数')+tile('财政余额',money(e.balance),'变化 '+(e.balanceDelta>=0?'+':'')+money(e.balanceDelta))+tile('账期收入',money(e.income),'最近账期统计')+tile('账期支出',money(e.expenses),'最近账期统计')+tile('账期净额',money(e.net),'收入减去支出')+tile('城市问题',fmt(s.problems.total),'问题对象')+tile('公共设施',fmt(s.facilities.total),'已建服务设施')+tile('道路',fmt(m.network.segments),'路段数量');const history=data.history||[];lineChart('population-chart',history,[{key:'population',color:'var(--blue)'}]);lineChart('balance-chart',history,[{key:'balance',color:'var(--green)'}],money);lineChart('finance-chart',history,[{key:'income',color:'var(--green)'},{key:'expenses',color:'var(--orange)'},{key:'net',color:'var(--purple)'}],money);lineChart('demand-chart',history,[{key:'residentialDemand',color:'var(--green)'},{key:'commercialDemand',color:'var(--blue)'},{key:'workplaceDemand',color:'var(--orange)'}]);const d=m.demand;$('demand').innerHTML=[['住宅',d.residential,'var(--green)'],['商业',d.commercial,'var(--blue)'],['就业',d.workplace,'var(--orange)']].map(([n,v,c])=>`<div>${n}<span style="float:right">${fmt(v)} / 100</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%;background:${c}"></i></div>`).join('');$('problems').innerHTML=rows(s.problems.countsByProblem);$('facilities').innerHTML=rows(s.facilities.countsByService);const gc=s.growables?.countsByService||{};$('buildings').innerHTML=rows([{name:'Residential',count:gc.Residential??null},{name:'Commercial',count:gc.Commercial??null},{name:'Industrial',count:gc.Industrial??null}]);$('zones').innerHTML=rows((s.zones.zones||[]).filter(x=>x.zone!=='Unzoned').map(x=>({name:x.zone,count:x.cells})),' 格');$('taxes').innerHTML=rows((s.taxes||[]).map(x=>({name:label(x.subService),count:x.rate})),'%')}
let timer;async function poll(){try{const r=await fetch('/api/snapshot',{cache:'no-store'}),d=await r.json();if(!d.ok){$('meta').textContent='等待本地游戏首次推送…';return}render(d);renderAutonomy(d.latest.autonomyEvents||[]);renderBuildingTrend(d.history||[])}catch(e){$('meta').textContent='看板服务器暂不可用'}}function schedule(){clearInterval(timer);const seconds=Number($('refresh').value)||3;poll();timer=setInterval(poll,seconds*1000)}$('refresh').addEventListener('change',schedule);schedule();
</script></body></html>
